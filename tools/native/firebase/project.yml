name: GodotApplePluginsFirebase
options:
  bundleIdPrefix: com.kinutumble.plugins
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    ENABLE_BITCODE: NO
packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    exactVersion: 11.15.0
targets:
  GodotApplePluginsFirebase:
    type: framework
    platform: iOS
    sources:
      - Sources/GodotApplePluginsFirebase
      - path: Sources/GDExtension/GDExtensionSupport.c
      - path: Sources/GDExtension/include
        buildPhase: none
    dependencies:
      - framework: Frameworks/SwiftGodotRuntime.xcframework
        embed: false
      - package: Firebase
        product: FirebaseCore
      - package: Firebase
        product: FirebaseAnalytics
      - package: Firebase
        product: FirebaseCrashlytics
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kinutumble.plugins.GodotApplePluginsFirebase
        DEFINES_MODULE: YES
        SKIP_INSTALL: NO
        BUILD_LIBRARY_FOR_DISTRIBUTION: YES
        MACH_O_TYPE: mh_dylib
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        OTHER_LDFLAGS: "-ObjC"
        HEADER_SEARCH_PATHS: "$(SRCROOT)/Sources/GDExtension/include"
        SWIFT_INCLUDE_PATHS: "$(SRCROOT)/Sources/GDExtension/include"
        CLANG_ENABLE_MODULES: YES
