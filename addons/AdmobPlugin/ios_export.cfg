; Read by AdmobPlugin's export-time hook (see AdmobIosExportConfig.gd) to write
; GADApplicationIdentifier, the ATT usage string and the SKAdNetwork list into
; the exported Xcode project's Info.plist. Both entries use the real app ID, which
; Google allows alongside test ad units. Which ad units load is decided at runtime
; in scripts/main.gd: test units in debug builds, real units in release builds.
[General]
is_real=true

[Debug]
app_id="ca-app-pub-1257499604453174~7129218341"

[Release]
app_id="ca-app-pub-1257499604453174~7129218341"

[ATT]
att_enabled=true
att_text="This identifier lets us show you ads relevant to you."
